<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRYSTAL Auth</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="card"><h1>CRYSTAL</h1><p class="muted">Secure account access</p><section id="loggedOut"><div class="tabs"><button onclick="show('login')">Sign in</button><button onclick="show('register')">Create account</button></div><form id="login" onsubmit="login(event)"><input id="liEmail" type="email" placeholder="Email" required><input id="liPassword" type="password" placeholder="Password" required><button>Sign in</button></form><form id="register" class="hidden" onsubmit="register(event)"><input id="reName" placeholder="Name"><input id="reEmail" type="email" placeholder="Email" required><input id="rePassword" type="password" placeholder="Password (12+ characters)" minlength="12" required><button>Create account</button></form><div class="or">or</div><div class="oauth"><a href="/auth/google">Continue with Google</a><a href="/auth/microsoft">Continue with Microsoft</a></div></section><section id="loggedIn" class="hidden"><p id="user"></p><button onclick="setupMfa()">Set up authenticator</button><button onclick="logout()">Sign out</button><div id="mfa"></div></section><p id="message"></p></main><script src="/app.js"></script></body></html>
