<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRYSTAL — Secure access</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="brand"><div class="logo">✦</div><div><strong>CRYSTAL</strong><span>Secure identity</span></div></section><section class="card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to CRYSTAL</h1><p class="muted">Access your account securely.</p><section id="loggedOut"><div class="providers"><a href="/auth/google"><b>G</b> Continue with Google</a><a href="/auth/microsoft"><b>▦</b> Continue with Microsoft</a></div><div class="divider"><span>or</span></div><div class="tabs"><button onclick="show('login')">Sign in</button><button onclick="show('register')">Create account</button></div><form id="login" onsubmit="login(event)"><label>Email<input id="liEmail" type="email" placeholder="you@example.com" required></label><label>Password<input id="liPassword" type="password" placeholder="••••••••••••" required></label><button class="primary">Sign in</button></form><form id="register" class="hidden" onsubmit="register(event)"><label>Name<input id="reName" placeholder="Your name"></label><label>Email<input id="reEmail" type="email" placeholder="you@example.com" required></label><label>Password<input id="rePassword" type="password" placeholder="12+ characters" minlength="12" required></label><button class="primary">Create account</button></form></section><section id="loggedIn" class="hidden"><div class="success">✓</div><h2>You're signed in</h2><p id="user" class="muted"></p><button class="primary" onclick="setupMfa()">Set up authenticator</button><button class="secondary" onclick="logout()">Sign out</button><div id="mfa"></div></section><p id="message" class="message"></p></section></main><script src="/app.js"></script></body></html>
